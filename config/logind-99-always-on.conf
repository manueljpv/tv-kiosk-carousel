# Install as /etc/systemd/logind.conf.d/99-always-on.conf
# Stops the system from suspending, hibernating, or reacting to the lid or to idleness.
[Login]
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore
